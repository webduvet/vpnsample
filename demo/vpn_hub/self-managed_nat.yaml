AWSTemplateFormatVersion: '2010-09-09'
Description: >
  HA VPN Hub VPC with a NAT Instance for SNAT and a VPC-Attached VPN to ICE,
  connected to a Transit Gateway.

Parameters:
  VpnVpcCidr:
    Type: String
    Default: 10.100.0.0/16
  PrivateSubnetACidr:
    Type: String
    Default: 10.100.0.0/24
  PublicSubnetACidr:
    Type: String
    Default: 10.100.1.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.100.2.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.100.3.0/24
  ExistingTgwId:
    Type: String
    Default: ""
    Description: "(Optional) The ID of an existing Transit Gateway to use. If left blank, a new one will be created."
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access to the NAT instance.
  NatInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the NAT instance.
  ICENetworkCidrs:
    Type: String
    Description: >
      A single CIDR prefix for the ICE network (e.g., 158.224.40.0/24).
      You MUST manually add more routes for all other ICE prefixes.
  ICECustomerGatewayIpMahwah:
    Type: String
    Description: The public IP address for the ICE Mahwah VPN endpoint.
  VpnTunnel1PreSharedKeySecret:
    Type: String
    Description: ARN of the AWS Secrets Manager secret for Mahwah Tunnel 1 PSK.
  VpnTunnel2PreSharedKeySecret:
    Type: String
    Description: ARN of the AWS Secrets Manager secret for Mahwah Tunnel 2 PSK.
  ICECustomerGatewayIpChicago:
    Type: String
    Description: The public IP address for the ICE Chicago VPN endpoint.
  VpnTunnel3PreSharedKeySecret:
    Type: String
    Description: ARN of the AWS Secrets Manager secret for Chicago Tunnel 1 PSK.
  VpnTunnel4PreSharedKeySecret:
    Type: String
    Description: ARN of the AWS Secrets Manager secret for Chicago Tunnel 2 PSK.

Conditions:
  CreateNewTgw: !Equals [!Ref ExistingTgwId, ""]

Resources:
  # SECTION: VPC and Core Networking (Multi-AZ)
  VpnVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpnVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPN-Hub-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: VPN-Hub-IGW

  VPCGatewayAttachmentIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpnVpc
      InternetGatewayId: !Ref InternetGateway

  # --- Subnets in AZ 'a'
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpnVpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPN-Hub-Private-Subnet-A

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpnVpc
      CidrBlock: !Ref PublicSubnetACidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPN-Hub-Public-Subnet-A

  # --- Subnets in AZ 'b'
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpnVpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPN-Hub-Private-Subnet-B

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpnVpc
      CidrBlock: !Ref PublicSubnetBCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPN-Hub-Public-Subnet-B

  # SECTION: NAT Instance (EC2) for SNAT
  NatInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allow traffic to NAT instance from within the VPC"
      VpcId: !Ref VpnVpc
      SecurityGroupIngress:
        - IpProtocol: -1 # Allow all traffic from within the VPC
          CidrIp: !Ref VpnVpcCidr
      Tags:
        - Key: Name
          Value: nat-instance-sg
  
  NatInstanceEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref NatInstanceType
      KeyName: !Ref KeyName
      SourceDestCheck: false
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnetA
          GroupSet: [!Ref NatInstanceSecurityGroup]
      UserData:
        Fn::Base64: |
          #!/bin/bash -xe
          yum update -y
          systemctl stop firewalld
          systemctl disable firewalld
          yum install -y iptables-services
          systemctl enable iptables
          systemctl start iptables
          echo 1 > /proc/sys/net/ipv4/ip_forward
          /sbin/iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          /sbin/iptables-save > /etc/sysconfig/iptables
      Tags:
        - Key: Name
          Value: VPN-Hub-NAT-Instance

  # SECTION: Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpnVpc
      Tags:
        - Key: Name
          Value: VPN-Hub-Public-RTB
  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachmentIGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpnVpc
      Tags:
        - Key: Name
          Value: VPN-Hub-Private-RTB-A
  DefaultPrivateRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NatInstance
  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpnVpc
      Tags:
        - Key: Name
          Value: VPN-Hub-Private-RTB-B
  DefaultPrivateRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NatInstance
  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # SECTION: Virtual Private Gateway (VGW) and VPC-Attached VPN
  VPNGateway:
    Type: AWS::EC2::VPNGateway
    Properties:
      Type: ipsec.1
      Tags:
        - Key: Name
          Value: VPN-Hub-VGW
  
  VPCGatewayAttachmentVGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpnVpc
      VpnGatewayId: !Ref VPNGateway

  PublicRouteToIce:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachmentVGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: !Ref ICENetworkCidrs
      GatewayId: !Ref VPNGateway

  CustomerGatewayMahwah:
    Type: AWS::EC2::CustomerGateway
    Properties:
      IpAddress: !Ref ICECustomerGatewayIpMahwah
      Type: ipsec.1
      BgpAsn: 65000
      Tags:
        - Key: Name
          Value: ICE-CGW-Mahwah
  VPNConnectionMahwah:
    Type: AWS::EC2::VPNConnection
    Properties:
      Type: ipsec.1
      VpnGatewayId: !Ref VPNGateway
      CustomerGatewayId: !Ref CustomerGatewayMahwah
      StaticRoutesOnly: true
      VpnTunnelOptionsSpecifications:
        - PreSharedKey: !Join ['', ['{{resolve:secretsmanager:', !Ref VpnTunnel1PreSharedKeySecret, '}}']]
        - PreSharedKey: !Join ['', ['{{resolve:secretsmanager:', !Ref VpnTunnel2PreSharedKeySecret, '}}']]
      Tags:
        - Key: Name
          Value: ICE-VPN-Mahwah
  
  CustomerGatewayChicago:
    Type: AWS::EC2::CustomerGateway
    Properties:
      IpAddress: !Ref ICECustomerGatewayIpChicago
      Type: ipsec.1
      BgpAsn: 65001
      Tags:
        - Key: Name
          Value: ICE-CGW-Chicago
  VPNConnectionChicago:
    Type: AWS::EC2::VPNConnection
    Properties:
      Type: ipsec.1
      VpnGatewayId: !Ref VPNGateway
      CustomerGatewayId: !Ref CustomerGatewayChicago
      StaticRoutesOnly: true
      VpnTunnelOptionsSpecifications:
        - PreSharedKey: !Join ['', ['{{resolve:secretsmanager:', !Ref VpnTunnel3PreSharedKeySecret, '}}']]
        - PreSharedKey: !Join ['', ['{{resolve:secretsmanager:', !Ref VpnTunnel4PreSharedKeySecret, '}}']]
      Tags:
        - Key: Name
          Value: ICE-VPN-Chicago

  # SECTION: Transit Gateway
  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Condition: CreateNewTgw
    Properties:
      Description: Central TGW for VPN routing
      AutoAcceptSharedAttachments: enable
      DefaultRouteTableAssociation: disable
      DefaultRouteTablePropagation: disable
      Tags:
        - Key: Name
          Value: Central-TGW
  TGWRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !If [CreateNewTgw, !Ref TransitGateway, !Ref ExistingTgwId]
      Tags:
        - Key: Name
          Value: TGW-Spoke-to-VPN-RouteTable
  TGWAttachment:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties:
      TransitGatewayId: !If [CreateNewTgw, !Ref TransitGateway, !Ref ExistingTgwId]
      VpcId: !Ref VpnVpc
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Tags:
        - Key: Name
          Value: VPN-Hub-VPC-TGW-Attachment
  TGWAssociation:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !Ref TGWAttachment
      TransitGatewayRouteTableId: !Ref TGWRouteTable
  TgwRouteToIce:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTable
      DestinationCidrBlock: !Ref ICENetworkCidrs
      TransitGatewayAttachmentId: !Ref TGWAttachment

Outputs:
  NatInstanceEIP:
    Description: The public IP address of the NAT Instance. Provide this to ICE.
    Value: !Ref NatInstanceEIP
  VPNConnectionMahwahId:
    Value: !Ref VPNConnectionMahwah
  VPNConnectionChicagoId:
    Value: !Ref VPNConnectionChicago
  TransitGatewayId:
    Value: !If [CreateNewTgw, !Ref TransitGateway, !Ref ExistingTgwId]
