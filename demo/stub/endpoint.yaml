AWSTemplateFormatVersion: '2010-09-09'
Description: ICE VPN Stub Simulation in Separate AWS Account

Parameters:
  ICEVpcCidr:
    Type: String
    Default: 10.99.0.0/16
  PrivateSubnetCidr:
    Type: String
    Default: 10.99.1.0/24
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair

Resources:

  ICEVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref ICEVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: ICE-VPC

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ICEVpc
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ICEVpc

  RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref RouteTable

  # VGW simulates ICE's physical VPN appliance
  ICEVpnGateway:
    Type: AWS::EC2::VPNGateway
    Properties:
      Type: ipsec.1
      Tags:
        - Key: Name
          Value: ICE-VPN-GW

  AttachVGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ICEVpc
      VpnGatewayId: !Ref ICEVpnGateway

  # Security group for nginx
  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from VPN-connected network
      VpcId: !Ref ICEVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.0.0/8
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/8

  NginxInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref WebSG
      ImageId: ami-0c02fb55956c7d316  # Amazon Linux 2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          amazon-linux-extras install nginx1 -y
          systemctl enable nginx
          systemctl start nginx
      Tags:
        - Key: Name
          Value: ICE-nginx

Outputs:
  ICEVpcId:
    Value: !Ref ICEVpc
  ICEVpnGatewayId:
    Value: !Ref ICEVpnGateway
  NginxInstancePrivateIp:
    Value: !GetAtt NginxInstance.PrivateIp
    Description: Private IP of test NGINX endpoint (VPN-only access)
    
