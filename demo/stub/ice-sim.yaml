AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ICE Simulator (VTI): Libreswan-based VPN peer with 1:1 NETMAP (public<->private) in its own VPC.
  Route-based IPsec (vti0). Use as a test "partner" for VGW/TGW VPN from your hub.

Parameters:
  # --- VPC / Subnets ---
  IceSimVpcCidr:
    Type: String
    Default: 10.200.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.200.0.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.200.1.0/24

  # --- Hub VPC (VGW-attached) CIDR to route into the tunnel ---
  HubVpcCidr:
    Type: String
    Default: 10.100.0.0/16
    Description: The VPC CIDR behind your VGW/TGW on the hub side. Routed via vti0.

  # --- "ICE public" prefix you'll route over the VPN (use TEST-NET-3 by default) ---
  IcePublicPrefix:
    Type: String
    Default: 203.0.113.0/24
    Description: ICE public service prefix to advertise over the VPN (routed, not Internet). Must be same mask length as BackendPrivatePrefix.

  # --- Private backend prefix that receives DNAT (must be same mask length) ---
  BackendPrivatePrefix:
    Type: String
    Default: 10.200.1.0/24
    Description: Private subnet to which IcePublicPrefix will be 1:1 mapped via NETMAP.

  # --- Optional simple backend port to demo (python http.server will listen here) ---
  BackendDemoPort:
    Type: Number
    Default: 8080

  # --- Your hub-side VGW tunnel outside IPs + PSKs (paste from downloaded AWS VPN config) ---
  VgwTunnel1OutsideIp:
    Type: String
    Description: AWS VGW Tunnel 1 outside IP (from hub VPN config)
  VgwTunnel2OutsideIp:
    Type: String
    Description: AWS VGW Tunnel 2 outside IP (from hub VPN config)
  Tunnel1Psk:
    Type: String
    NoEcho: true
    Description: Pre-shared key for Tunnel 1 (must match hub)
  Tunnel2Psk:
    Type: String
    NoEcho: true
    Description: Pre-shared key for Tunnel 2 (must match hub)

  # --- IKE/ESP knobs (match your hub's settings; defaults fit ICE sheet) ---
  IkeVersion:
    Type: String
    AllowedValues: [ikev1, ikev2]
    Default: ikev2
  Phase1DhGroup:
    Type: Number
    Default: 19
  Phase1LifetimeSeconds:
    Type: Number
    Default: 14400
  Phase2LifetimeSeconds:
    Type: Number
    Default: 3600

  # ---------------- AMI & (optional) SSM role ----------------
  AmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64"

Mappings:
  RegionMap:
    dummy: { dummy: dummy }

Resources:
  # ---------------- VPC & Routing ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref IceSimVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: ICE-Sim-VPC }]

  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: ICE-Sim-IGW }]

  AttachIgw:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref IGW
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: ICE-Sim-Public }]

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: ICE-Sim-Private }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: ICE-Sim-Public-RTB }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  AssocPublicRT:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: ICE-Sim-Private-RTB }]

  AssocPrivateRT:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ---------------- Security Groups ----------------
  SgLibreSwan:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LibreSwan VPN appliance SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: IKE
          IpProtocol: udp
          FromPort: 500
          ToPort: 500
          CidrIp: 0.0.0.0/0
        - Description: NAT-T
          IpProtocol: udp
          FromPort: 4500
          ToPort: 4500
          CidrIp: 0.0.0.0/0
        - Description: SSH (lab only; lock down in real use)
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: ICE-Sim-LibreSwan-SG }]

  SgBackend:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend demo host SG
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Backend demo port from VPN host (SG-to-SG)
          IpProtocol: tcp
          FromPort: !Ref BackendDemoPort
          ToPort: !Ref BackendDemoPort
          SourceSecurityGroupId: !Ref SgLibreSwan
        - Description: Allow hub sources to demo port (forwarded traffic)
          IpProtocol: tcp
          FromPort: !Ref BackendDemoPort
          ToPort: !Ref BackendDemoPort
          CidrIp: !Ref HubVpcCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: ICE-Sim-Backend-SG }]

  # ---------------- Elastic IP for the VPN peer ----------------
  VpnEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: ICE-Sim-EIP }]

  # ---------------- EC2: LibreSwan (VPN & 1:1 NAT via vti0) ----------------
  LibreSwanInstance:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: !Ref InstanceProfile
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          SubnetId: !Ref PublicSubnet
          GroupSet: [!Ref SgLibreSwan]
      SourceDestCheck: false
      Tags:
        - { Key: Name, Value: ICE-Sim-LibreSwan }
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euxo pipefail

              dnf -y update || true
              # dnf -y install libreswan conntrack-tools
              dnf -y install libreswan nftables

              # Kernel & sysctl
              cat >/etc/sysctl.d/99-ice-sim.conf <<'EOF'
              net.ipv4.ip_forward=1
              net.ipv4.conf.all.rp_filter=0
              net.ipv4.conf.default.rp_filter=0
              EOF
              sysctl --system

              modprobe ip_vti || true
              modprobe xfrm_user || true

              ip route flush table 220 || true
              ip rule del table 220 2>/dev/null || true
              ip rule del fwmark 42/0xffffffff table 220 2>/dev/null || true


              # Libreswan VTI config (route-based)
              cat >/etc/ipsec.d/vgw.conf <<EOF
              config setup
                uniqueids=no

              conn %default
                keyexchange=${IkeVersion}
                ike=aes256-sha256-dh${Phase1DhGroup}
                esp=aes256-sha256-dh${Phase1DhGroup}
                pfs=yes
                ikelifetime=${Phase1LifetimeSeconds}s
                salifetime=${Phase2LifetimeSeconds}s
                dpddelay=30s
                dpdtimeout=120s
                authby=secret

                # VTI
                mark=42/0xffffffff
                vti-interface=vti0
                vti-shared=yes
                vti-routing=no    # we add explicit routes below

                # Wide selectors keep VGW happy; we control real traffic via routes
                left=%defaultroute
                leftid=${EipPublic}
                leftsubnet=0.0.0.0/0
                rightsubnet=0.0.0.0/0
                type=tunnel
                overlapip=yes

              conn vgw1
                also=%default
                right=${VgwTunnel1OutsideIp}
                auto=start

              conn vgw2
                also=vgw1
                right=${VgwTunnel2OutsideIp}
                auto=start
              EOF

              cat >/etc/ipsec.d/vgw.secrets <<EOF
              ${EipPublic} ${VgwTunnel1OutsideIp} : PSK "${Tunnel1Psk}"
              ${EipPublic} ${VgwTunnel2OutsideIp} : PSK "${Tunnel2Psk}"
              EOF
              chmod 600 /etc/ipsec.d/vgw.secrets

              systemctl enable --now ipsec

              # Bring up vti0 explicitly (pluto usually does this)
              ip link set vti0 up || true

              # Route hub VPC via the tunnel (so backend replies enter vti0)
              ip route replace ${HubVpcCidr} dev vti0


              # ... after ipsec is up and vti0 exists ...

              # NAT via nftables (single demo host example)
              ICE_IP=203.0.113.246
              BE_IP=10.200.1.246
              PRIMARY_DEV=$(ip -o -4 route show to default | awk '{print $5}')

              nft add table ip nat 2>/dev/null || true
              nft 'add chain ip nat prerouting { type nat hook prerouting priority -100; }' 2>/dev/null || true
              nft 'add chain ip nat postrouting { type nat hook postrouting priority 100; }' 2>/dev/null || true

              nft 'flush chain ip nat prerouting'
              nft 'flush chain ip nat postrouting'

              nft "add rule ip nat prerouting iif vti0 ip daddr $ICE_IP tcp dport ${BackendDemoPort} dnat to $BE_IP"
              nft "add rule ip nat postrouting oif $PRIMARY_DEV masquerade"

              # Forwarding (nft filter)
              nft add table ip filter 2>/dev/null || true
              nft 'add chain ip filter FORWARD { type filter hook forward priority 0; policy accept; }' 2>/dev/null || true
              nft 'flush chain ip filter FORWARD'
              nft "add rule ip filter FORWARD iifname vti0 oifname $PRIMARY_DEV accept"
              nft "add rule ip filter FORWARD iifname $PRIMARY_DEV  oifname vti0 accept"
              nft "add rule ip filter FORWARD ct state related,established accept"

              # Persist nft rules
              nft list ruleset > /etc/nftables.conf
              systemctl enable --now nftables

              echo "ICE simulator (VTI) ready. EIP=${EipPublic}"
            -
              EipPublic: !GetAtt VpnEip.PublicIp
              VgwTunnel1OutsideIp: !Ref VgwTunnel1OutsideIp
              VgwTunnel2OutsideIp: !Ref VgwTunnel2OutsideIp
              Tunnel1Psk: !Ref Tunnel1Psk
              Tunnel2Psk: !Ref Tunnel2Psk
              IcePublicPrefix: !Ref IcePublicPrefix
              BackendPrivatePrefix: !Ref BackendPrivatePrefix
              IkeVersion: !Ref IkeVersion
              Phase1DhGroup: !Ref Phase1DhGroup
              Phase1LifetimeSeconds: !Ref Phase1LifetimeSeconds
              Phase2LifetimeSeconds: !Ref Phase2LifetimeSeconds
              HubVpcCidr: !Ref HubVpcCidr

    DependsOn:
      - AssocPublicRT

  # Associate EIP to the instance
  EipAssoc:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt VpnEip.AllocationId
      InstanceId: !Ref LibreSwanInstance

  # ---------------- EC2: simple backend in private subnet ----------------
  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          SubnetId: !Ref PrivateSubnet
          GroupSet: [!Ref SgBackend]
      Tags:
        - { Key: Name, Value: ICE-Sim-Backend }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # Base updates + nginx
          dnf -y update || true
          dnf -y install nginx

          # (Optional) relax rp_filter in case of asymmetric return
          cat >/etc/sysctl.d/99-ice-backend.conf <<'EOF'
          net.ipv4.conf.all.rp_filter=0
          net.ipv4.conf.default.rp_filter=0
          EOF
          sysctl --system

          # Simple content directory (optional)
          mkdir -p /var/www/backend-demo
          printf 'Backend demo up on %s\n' "$(hostname -f)" >/var/www/backend-demo/index.txt

          # Remove default vhost on :80 to avoid confusion
          rm -f /etc/nginx/conf.d/default.conf || true

          # Minimal plain-text responder on ${BackendDemoPort}
          cat >/etc/nginx/conf.d/backend_demo.conf <<'EOF'
          server {
            listen ${BackendDemoPort} default_server;
            server_name _;
            access_log /var/log/nginx/backend_access.log;
            error_log  /var/log/nginx/backend_error.log;

            # Always reply in plain text
            default_type text/plain;

            # Health checks
            location = /health { return 200 "ok\n"; }
            location = /ping   { return 200 "pong\n"; }

            # Echo basic request info (handy for path/args testing)
            location /info {
              return 200 "host: $hostname
          method: $request_method
          uri: $request_uri
          args: $args
          client: $remote_addr
          ua: $http_user_agent
          ";
            }

            # Root: short banner
            location = / {
              return 200 "ICE backend demo on $hostname (${BackendDemoPort})
          Try /health, /ping, or /info
          ";
            }

            # Optional: serve static files under /static/
            location /static/ {
              alias /var/www/backend-demo/;
              autoindex on;
            }
          }
          EOF

          nginx -t
          systemctl enable --now nginx

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags: [{ Key: Name, Value: ICE-Sim-InstanceRole }]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # Private subnet must send hub-sourced traffic back via the router instance
  RouteHubPrefixViaLibreSwan:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 10.100.2.0/27   # hub’s source prefix used in tests
      InstanceId: !Ref LibreSwanInstance
  # (Keep this. It ensures backend replies reach LibreSwan to enter vti0.)

Outputs:
  IceSimulatorEip:
    Description: Use this as the Customer Gateway IP on your hub stack.
    Value: !GetAtt VpnEip.PublicIp
  IcePublicPrefixSimulated:
    Description: Advertise this prefix over the VPN from your hub (VPN static routes).
    Value: !Ref IcePublicPrefix
  BackendPrivatePrefixUsed:
    Value: !Ref BackendPrivatePrefix
  LibreSwanInstanceId:
    Value: !Ref LibreSwanInstance
  BackendInstanceId:
    Value: !Ref BackendInstance
